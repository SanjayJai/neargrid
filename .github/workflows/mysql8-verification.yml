name: M-A0 MySQL 8 Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mysql8-verification:
    name: Backend MySQL 8.0 Spatial & Location Verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: neargrid_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: neargrid_ci_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, curl, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify MySQL 8.0+ version
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "SELECT VERSION() AS mysql_version;"

      - name: Run fresh migrations and seeding on disposable MySQL 8 DB
        working-directory: backend
        run: |
          php artisan migrate:fresh --seed --env=testing --force

      - name: Verify schema constraints (public_id NOT NULL, unique indexes, FKs, SRID 4326)
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot neargrid_ci_test -e "
            DESCRIBE states;
            DESCRIBE cities;
            DESCRIBE localities;
            SHOW CREATE TABLE states\G
            SHOW CREATE TABLE cities\G
            SHOW CREATE TABLE localities\G
          "
          mysql -h 127.0.0.1 -P 3306 -u root -proot -N -B -e "
            SELECT TABLE_NAME, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_SCHEMA = 'neargrid_ci_test'
              AND TABLE_NAME IN ('states', 'cities', 'localities')
              AND COLUMN_NAME = 'public_id';
          " | awk '
            BEGIN { count = 0 }
            {
              count++;
              if ($4 != "NO") {
                print "ERROR: " $1 "." $2 " IS_NULLABLE=" $4 > "/dev/stderr";
                exit 1;
              }
            }
            END {
              if (count != 3) {
                print "ERROR: Expected 3 public_id columns, found " count > "/dev/stderr";
                exit 1;
              }
              print "OK: All 3 location tables have public_id NOT NULL.";
            }
          '
          mysql -h 127.0.0.1 -P 3306 -u root -proot -N -B -e "
            SELECT TABLE_NAME, COLUMN_NAME, SRS_ID
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_SCHEMA = 'neargrid_ci_test'
              AND TABLE_NAME IN ('cities', 'localities')
              AND COLUMN_NAME = 'center_point';
          " | awk '
            BEGIN { count = 0 }
            {
              count++;
              if ($3 != "4326") {
                print "ERROR: " $1 "." $2 " SRS_ID=" $3 > "/dev/stderr";
                exit 1;
              }
            }
            END {
              if (count != 2) {
                print "ERROR: Expected 2 SRID 4326 columns, found " count > "/dev/stderr";
                exit 1;
              }
              print "OK: cities.center_point and localities.center_point use SRID 4326.";
            }
          '
          mysql -h 127.0.0.1 -P 3306 -u root -proot -N -B -e "
            SELECT TABLE_NAME, INDEX_NAME, GROUP_CONCAT(COLUMN_NAME ORDER BY SEQ_IN_INDEX SEPARATOR ',') AS cols
            FROM INFORMATION_SCHEMA.STATISTICS
            WHERE TABLE_SCHEMA = 'neargrid_ci_test'
              AND TABLE_NAME IN ('states', 'cities', 'localities')
              AND NON_UNIQUE = 0
              AND INDEX_NAME != 'PRIMARY'
            GROUP BY TABLE_NAME, INDEX_NAME
            ORDER BY TABLE_NAME, INDEX_NAME;
          " | awk '
            BEGIN {
              expected["states:uniq_states_country_slug"] = "country_code,slug";
              expected["states:uniq_states_country_name"] = "country_code,name";
              expected["states:uniq_states_public_id"] = "public_id";
              expected["cities:cities_slug_unique"] = "slug";
              expected["cities:uniq_cities_state_name"] = "state_id,name";
              expected["cities:uniq_cities_public_id"] = "public_id";
              expected["localities:uniq_localities_city_slug"] = "city_id,slug";
              expected["localities:uniq_localities_city_name"] = "city_id,name";
              expected["localities:uniq_localities_public_id"] = "public_id";
            }
            {
              key = $1 ":" $2;
              seen[key] = $3;
            }
            END {
              missing = 0;
              for (k in expected) {
                if (!(k in seen)) {
                  print "ERROR: Missing unique index " k " (" expected[k] ")" > "/dev/stderr";
                  missing = 1;
                } else if (seen[k] != expected[k]) {
                  print "ERROR: Unique index " k " columns=" seen[k] ", expected=" expected[k] > "/dev/stderr";
                  missing = 1;
                }
              }
              if (missing) exit 1;
              print "OK: All 9 expected unique indexes on states, cities, and localities are present.";
            }
          '
          mysql -h 127.0.0.1 -P 3306 -u root -proot -N -B -e "
            SELECT tc.TABLE_NAME, tc.CONSTRAINT_NAME, kcu.COLUMN_NAME, kcu.REFERENCED_TABLE_NAME, kcu.REFERENCED_COLUMN_NAME
            FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
            JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
              ON tc.CONSTRAINT_SCHEMA = kcu.CONSTRAINT_SCHEMA
             AND tc.TABLE_NAME = kcu.TABLE_NAME
             AND tc.CONSTRAINT_NAME = kcu.CONSTRAINT_NAME
            WHERE tc.CONSTRAINT_SCHEMA = 'neargrid_ci_test'
              AND tc.TABLE_NAME IN ('states', 'cities', 'localities')
              AND tc.CONSTRAINT_TYPE = 'FOREIGN KEY'
            ORDER BY tc.TABLE_NAME, tc.CONSTRAINT_NAME;
          " | awk '
            BEGIN {
              expected["cities:cities_state_id_foreign"] = "state_id->states.id";
              expected["localities:localities_city_id_foreign"] = "city_id->cities.id";
            }
            {
              key = $1 ":" $2;
              seen[key] = $3 "->" $4 "." $5;
            }
            END {
              missing = 0;
              for (k in expected) {
                if (!(k in seen)) {
                  print "ERROR: Missing foreign key " k " (" expected[k] ")" > "/dev/stderr";
                  missing = 1;
                } else if (seen[k] != expected[k]) {
                  print "ERROR: Foreign key " k " target=" seen[k] ", expected=" expected[k] > "/dev/stderr";
                  missing = 1;
                }
              }
              if (missing) exit 1;
              print "OK: All expected foreign keys on cities and localities are present.";
            }
          '

      - name: Run MySQL 8 integration and location management tests
        working-directory: backend
        run: |
          for test_file in \
            tests/Feature/Database/MySql8SpatialIntegrationTest.php \
            tests/Feature/Database/MySql8DirectoryIntegrationTest.php \
            tests/Feature/Search/MySql8SearchEngineIntegrationTest.php \
            tests/Feature/Api/V1/Locations/LocationManagementTest.php; do
            if [ ! -f "$test_file" ]; then
              echo "ERROR: Missing expected test file: $test_file" >&2
              exit 1
            fi
          done
          php artisan test \
            tests/Feature/Database/MySql8SpatialIntegrationTest.php \
            tests/Feature/Database/MySql8DirectoryIntegrationTest.php \
            tests/Feature/Search/MySql8SearchEngineIntegrationTest.php \
            tests/Feature/Api/V1/Locations/LocationManagementTest.php

      - name: Verify migration rollback and re-migration on disposable DB
        working-directory: backend
        run: |
          php artisan migrate:rollback --step=1 --env=testing --force
          php artisan migrate --env=testing --force
          mysql -h 127.0.0.1 -P 3306 -u root -proot -N -B -e "
            SELECT TABLE_NAME, COLUMN_NAME, IS_NULLABLE
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_SCHEMA = 'neargrid_ci_test'
              AND TABLE_NAME IN ('states', 'cities', 'localities')
              AND COLUMN_NAME = 'public_id';
          " | awk '
            BEGIN { count = 0 }
            {
              count++;
              if ($3 != "NO") {
                print "ERROR: Post-remigration " $1 "." $2 " IS_NULLABLE=" $3 > "/dev/stderr";
                exit 1;
              }
            }
            END {
              if (count != 3) {
                print "ERROR: Expected 3 public_id columns after re-migration, found " count > "/dev/stderr";
                exit 1;
              }
              print "OK: Post-remigration public_id NOT NULL verified for all 3 location tables.";
            }
          '
